<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>எப்பொழுதும் உன்னுடன் ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Arima+Madurai:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #1f1c2c, #928DAB, #ff758c, #ff7eb3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Arima Madurai', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
            padding: 20px; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
            animation: float 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }
        .particle:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .particle:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .particle:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .particle:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .particle:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;
            padding: 45px 40px;
            max-width: 900px;
            width: 100%; 
            text-align: center;
            z-index: 1;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 20px rgba(255, 117, 140, 0.2);
            transition: transform 0.6s ease, opacity 0.6s ease;
            max-height: 95vh;
            overflow-y: auto; 
        }

        .glass-card::-webkit-scrollbar {
            width: 8px;
        }
        .glass-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 10px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            font-weight: 400;
        }

        button {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 14px 35px;
            font-size: 18px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            font-family: inherit;
        }

        #start-btn {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        #start-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
            animation: none;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        #message-container {
            display: none;
            opacity: 0;
            width: 100%;
            flex-direction: column; 
            align-items: center;
        }

        .top-image {
            width: 80%; 
            max-width: 500px; 
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 3px solid rgba(255, 255, 255, 0.4);
            margin-bottom: 30px; 
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .content-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .side-gif {
            width: 130px; 
            height: auto;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 1.5s ease;
            flex-shrink: 0;
        }

        .text-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
                gap: 15px;
            }
            .side-gif {
                width: 120px;
            }
            .top-image {
                width: 95%; 
            }
        }
        
        .typewriter-message {
            text-align: left; 
            margin-bottom: 5px;
            width: 100%;
        }
        
        .cursor {
            display: inline-block;
            width: 3px;
            height: 20px;
            background-color: #fff;
            animation: blink 0.7s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .highlight {
            color: #ffb8c6;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 184, 198, 0.3);
        }

        #interactive-section {
            display: none;
            opacity: 0;
            margin-top: 20px;
            transition: opacity 1s ease;
            width: 100%;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            position: relative;
        }

        .action-btn {
            padding: 10px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        #no-btn {
            transition: all 0.2s ease-out;
            z-index: 100;
        }

        #final-msg {
            display: none;
            color: #ffb8c6;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
            text-shadow: 0 0 15px rgba(255, 184, 198, 0.5);
            animation: popIn 0.8s ease forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #yt-player {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <ul class="particles">
        <li class="particle"></li>
        <li class="particle"></li>
        <li class="particle"></li>
        <li class="particle"></li>
        <li class="particle"></li>
    </ul>

    <div class="glass-card" id="intro-card">
        <h1>என் அன்பே... ❤️</h1>
        <p>இப்போது உனக்கு எல்லாம் கடினமாகவும், இந்த உலகம் கொஞ்சம் பாரமாகவும் தெரிவது எனக்குப் புரிகிறது.</p><br>
        <button id="start-btn">தயாரானதும் தொடவும்</button>
    </div>

    <div class="glass-card" id="message-container">
        
        <img src="your_photo.jpg" alt="Main Photo" class="top-image" id="top-img">

        <div class="content-wrapper">
            
            <video src="hug.mp4" class="side-gif" id="left-gif" autoplay loop muted playsinline></video>
            
            <div class="text-wrapper">
                <p class="typewriter-message">
                    <span id="typewriter-text"></span><span class="cursor" id="cursor"></span>
                </p>

                <div id="interactive-section">
                    <p id="question-text">இப்போது கொஞ்சம் நன்றாக உணர்கிறாயா?</p>
                    <div class="btn-group" id="btn-group">
                        <button class="action-btn" id="yes-btn">ஆம் (Yes)</button>
                        <button class="action-btn" id="no-btn">இல்லை (No)</button>
                    </div>
                    <div id="final-msg">எல்லாம் விரைவில் சரியாகிவிடும் ❤️</div>
                </div>
            </div>

            <video src="hug.mp4" class="side-gif" id="right-gif" autoplay loop muted playsinline></video>
            
        </div>
    </div>

    <iframe id="yt-player" 
            src="" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>

    <script>
        const startBtn = document.getElementById('start-btn');
        const introCard = document.getElementById('intro-card');
        const messageContainer = document.getElementById('message-container');
        const typewriterElement = document.getElementById('typewriter-text');
        const ytPlayer = document.getElementById('yt-player');
        
        const topImg = document.getElementById('top-img');
        const leftGif = document.getElementById('left-gif');
        const rightGif = document.getElementById('right-gif');
        const cursor = document.getElementById('cursor');
        
        // Interactive Elements
        const interactiveSection = document.getElementById('interactive-section');
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const finalMsg = document.getElementById('final-msg');
        const questionText = document.getElementById('question-text');
        const btnGroup = document.getElementById('btn-group');

        // YouTube Settings
        const youtubeVideoId = 'B_BYxNsjF08'; 
        const startTimeInSeconds = 69; 
        const endTimeInSeconds = 110; 
        const musicSrc = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1&controls=0&showinfo=0&modestbranding=1&start=${startTimeInSeconds}&end=${endTimeInSeconds}`;

        const messageToType = "இந்த உலகில் அனைவரும் போலியாக இருப்பது போல் உனக்குத் தோன்றலாம். ஆனால் தயவுசெய்து கவலைப்படாதே.<br><br><span class='highlight'>எந்த சூழ்நிலையிலும் நான் எப்போதும் உனக்காக இருப்பேன்.</span><br><br>என்னிடம் நீ நீயாகவே இருக்கலாம். உன் மனதில் தோன்றும் எதை வேண்டுமானாலும் என்னிடம் தயங்காமல் சொல்லலாம். என்னிடம் நீ முழு பாதுகாப்பாக உணர்வாய்.<br><br><span class='highlight'>நான் உன்னை மிகவும் காதலிக்கிறேன், உனக்காக எப்போதும் இங்கேயே இருப்பேன்.</span>";
        
        let index = 0;

        startBtn.addEventListener('click', () => {
            ytPlayer.src = musicSrc;
            introCard.style.opacity = '0';
            
            setTimeout(() => {
                introCard.style.display = 'none';
                messageContainer.style.display = 'flex'; 
                void messageContainer.offsetWidth; 
                messageContainer.style.opacity = '1';
                
                topImg.style.opacity = '1';
                leftGif.style.opacity = '1';
                rightGif.style.opacity = '1';
                
                // Play videos automatically when revealed
                leftGif.play().catch(e => console.log("Auto-play prevented"));
                rightGif.play().catch(e => console.log("Auto-play prevented"));

                setTimeout(typeMessage, 600);
            }, 600);
        });

        function typeMessage() {
            if (index < messageToType.length) {
                if (messageToType.charAt(index) === '<') {
                    let tag = '';
                    while (messageToType.charAt(index) !== '>') {
                        tag += messageToType.charAt(index);
                        index++;
                    }
                    tag += '>';
                    typewriterElement.innerHTML += tag;
                    index++;
                } else {
                    typewriterElement.innerHTML += messageToType.charAt(index);
                    index++;
                }
                
                let typingSpeed = Math.floor(Math.random() * 20) + 40; 
                setTimeout(typeMessage, typingSpeed);
            } else {
                cursor.style.display = 'none'; 
                
                setTimeout(() => {
                    interactiveSection.style.display = 'block';
                    setTimeout(() => {
                        interactiveSection.style.opacity = '1';
                    }, 50);
                }, 800);
            }
        }

        // --- NO BUTTON DODGE LOGIC ---
        function dodgeButton(e) {
            e.preventDefault(); 
            noBtn.style.position = 'fixed';
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            const randomX = Math.max(20, Math.floor(Math.random() * maxX));
            const randomY = Math.max(20, Math.floor(Math.random() * maxY));
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', dodgeButton);
        noBtn.addEventListener('touchstart', dodgeButton);
        noBtn.addEventListener('click', dodgeButton);

        // --- YES BUTTON LOGIC ---
        yesBtn.addEventListener('click', () => {
            questionText.style.display = 'none';
            btnGroup.style.display = 'none';
            noBtn.style.display = 'none'; 
            finalMsg.style.display = 'block';
        });
    </script>
</body>
</html>
